# Common Database Configuration
app.database.query-timeout=30
app.database.fetch-size=1000
app.database.max-pool-size=10
app.database.min-pool-size=2

# H2 Test Database Configuration (Pure H2 mode)
app.database.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
app.database.username=sa
app.database.password=
app.database.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.com.gothamdude.core.data=DEBUG
logging.level.org.springframework.jdbc=INFO
logging.level.org.springframework.test=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

